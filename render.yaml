services:
  - type: web
    name: dravyaguna-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: PG_POOL_MAX
        value: 10
      - key: NODE_ENV
        value: production
